<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profiles(JSON)</title>
</head>
<body>
    <h1>User Profiles</h1>
    <div id="userList"></div>

    <script>
        fetch('userProfiles.json')
        .then(response => {
            if (!response.ok) throw new Error('Fetch error: ' + response.status)
            return response.json();
        })
        .then(json => {
            const container = document.getElementById("userList");
            json.forEach(user => {
                container.innerHTML += `
                <div>
                    <p>Name: ${user.firstName} ${user.lastName}</p>
                    <p>Email: ${user.email}</p>
                    <p>Birthday: ${user.dateOfBirth}</p>
                    <p>Address: ${user.address.street}, ${user.address.city}, ${user.address.state}, ${user.address.zipCode}</p>
                    <p>Theme: ${user.preferences.theme}</p>
                    <p>Language: ${user.preferences.language}</p>
                    <p>Notifications: ${user.preferences.notifications}</p>
                    <p>Newsletter subscribed: ${user.preferences.subscription}</p>
                </div>
                `
            })
        })
        .catch(err => console.error('Fetch error: ' + err.message));
    </script>
</body>
</html>
